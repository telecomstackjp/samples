<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Mind Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #e0e0e0; }
  #canvas { display: block; }

  /* UI Overlay */
  #toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px 16px;
    background: rgba(20, 20, 40, 0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    z-index: 10;
  }
  .btn {
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; background: rgba(255,255,255,0.05);
    color: #e0e0e0; cursor: pointer; font-size: 13px; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
  .btn.active { background: rgba(100,140,255,0.25); border-color: rgba(100,140,255,0.5); }
  .btn svg { width: 16px; height: 16px; }

  /* Node editor modal */
  #node-editor {
    display: none; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20, 20, 45, 0.95); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    padding: 24px; min-width: 320px; z-index: 20;
  }
  #node-editor.visible { display: block; }
  #node-editor h3 { margin-bottom: 16px; font-weight: 500; font-size: 16px; }
  #node-editor input, #node-editor select {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: #e0e0e0; font-size: 14px; outline: none;
  }
  #node-editor input:focus { border-color: rgba(100,140,255,0.5); }
  .editor-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .color-picker { display: flex; gap: 6px; margin-bottom: 12px; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
  }
  .color-swatch:hover, .color-swatch.selected { border-color: #fff; transform: scale(1.15); }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 15; }
  #overlay.visible { display: block; }

  /* Help panel */
  #help {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(20, 20, 40, 0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 12px 16px; font-size: 12px; color: rgba(255,255,255,0.5);
    z-index: 10; line-height: 1.6;
  }
  #help kbd {
    background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 4px;
    font-family: inherit;
  }

  /* Info panel */
  #info-panel {
    position: fixed; top: 80px; right: 16px;
    background: rgba(20, 20, 40, 0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 16px; font-size: 13px; z-index: 10; min-width: 200px;
    display: none;
  }
  #info-panel.visible { display: block; }
  #info-panel h4 { margin-bottom: 8px; font-weight: 500; color: rgba(255,255,255,0.7); }
  #info-panel .stat { display: flex; justify-content: space-between; padding: 4px 0; }

  /* Toast */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 20, 45, 0.95); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 20px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; z-index: 30; pointer-events: none;
  }
  #toast.visible { opacity: 1; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="btn" id="btn-add" title="Add node (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Node
  </button>
  <button class="btn" id="btn-connect" title="Connect mode (C)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A3 3 0 1 0 18 2a3 3 0 0 0 0 6zM6 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 8l-12 8"/></svg>
    Connect
  </button>
  <button class="btn" id="btn-delete" title="Delete selected (Del)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
  <button class="btn" id="btn-reset" title="Reset view (R)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 3v6h6"/></svg>
    Reset
  </button>
  <button class="btn" id="btn-save" title="Save (Ctrl+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Save
  </button>
  <button class="btn" id="btn-load" title="Load (Ctrl+L)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Load
  </button>
</div>

<div id="overlay"></div>
<div id="node-editor">
  <h3 id="editor-title">Add Node</h3>
  <input type="text" id="node-text" placeholder="Node label..." maxlength="50" autocomplete="off">
  <div class="color-picker" id="color-picker"></div>
  <div class="editor-actions">
    <button class="btn" id="editor-cancel">Cancel</button>
    <button class="btn" id="editor-save" style="background:rgba(100,140,255,0.3);border-color:rgba(100,140,255,0.5);">Save</button>
  </div>
</div>

<div id="help">
  <kbd>Double-click</kbd> node to edit &middot; <kbd>Drag</kbd> node to move &middot;
  <kbd>Scroll</kbd> to zoom<br>
  <kbd>Right-drag</kbd> to orbit &middot; <kbd>N</kbd> add &middot;
  <kbd>C</kbd> connect &middot; <kbd>Del</kbd> delete &middot; <kbd>Esc</kbd> deselect
</div>

<div id="info-panel">
  <h4>Mind Map</h4>
  <div class="stat"><span>Nodes</span><span id="stat-nodes">0</span></div>
  <div class="stat"><span>Connections</span><span id="stat-edges">0</span></div>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ── Constants ──
const NODE_COLORS = [
  '#6C8CFF', '#FF6B8A', '#50D890', '#FFB84D', '#B980FF',
  '#FF80BF', '#5CE0D8', '#FF6B6B', '#7ED957', '#FFA3E0',
];

const GLOW_INTENSITY = 0.6;
const NODE_RADIUS = 1.2;
const EDGE_COLOR = 0x4466aa;

// ── State ──
const state = {
  nodes: [],
  edges: [],
  selectedNode: null,
  connectSource: null,
  connectMode: false,
  hoveredNode: null,
  dragging: false,
  dragNode: null,
  nextId: 1,
};

// ── Scene setup ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 8, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
renderer.domElement.id = 'canvas';

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };

// Lighting
const ambient = new THREE.AmbientLight(0x334466, 1.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x6688cc, 1.5, 60);
pointLight.position.set(-5, 10, -5);
scene.add(pointLight);

// Background particles
const starGeo = new THREE.BufferGeometry();
const starCount = 600;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 120;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x4466aa, size: 0.15, transparent: true, opacity: 0.5 });
scene.add(new THREE.Points(starGeo, starMat));

// Grid
const gridHelper = new THREE.GridHelper(60, 30, 0x1a1a3a, 0x111133);
gridHelper.position.y = -5;
scene.add(gridHelper);

// Raycaster
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

// ── Node creation ──
function createNodeMesh(label, colorHex, position) {
  const color = new THREE.Color(colorHex);

  // Sphere
  const geo = new THREE.SphereGeometry(NODE_RADIUS, 32, 32);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: GLOW_INTENSITY,
    roughness: 0.3, metalness: 0.2, transparent: true, opacity: 0.92,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);

  // Glow ring
  const ringGeo = new THREE.TorusGeometry(NODE_RADIUS * 1.3, 0.05, 16, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.4 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  mesh.add(ring);

  // Label sprite
  const sprite = makeTextSprite(label, colorHex);
  sprite.position.set(0, NODE_RADIUS + 0.8, 0);
  mesh.add(sprite);

  mesh.userData = { type: 'node', sprite, ring };
  scene.add(mesh);
  return mesh;
}

function makeTextSprite(text, bgColor) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 48;
  ctx.font = `600 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
  const metrics = ctx.measureText(text);
  const textWidth = metrics.width;
  const padding = 24;

  canvas.width = textWidth + padding * 2;
  canvas.height = fontSize + padding * 2;

  // Background pill
  ctx.fillStyle = 'rgba(10, 10, 30, 0.75)';
  const r = canvas.height / 2;
  ctx.beginPath();
  ctx.roundRect(0, 0, canvas.width, canvas.height, r);
  ctx.fill();

  // Border
  ctx.strokeStyle = bgColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(1, 1, canvas.width - 2, canvas.height - 2, r);
  ctx.stroke();

  // Text
  ctx.fillStyle = '#ffffff';
  ctx.font = `600 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(canvas.width / 80, canvas.height / 80, 1);
  return sprite;
}

// ── Edge creation ──
function createEdgeLine(nodeA, nodeB) {
  const points = [nodeA.mesh.position.clone(), nodeB.mesh.position.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: EDGE_COLOR, transparent: true, opacity: 0.6, linewidth: 1,
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  return line;
}

// ── API ──
function addNode(label, colorHex, pos) {
  const id = state.nextId++;
  const position = pos || new THREE.Vector3(
    (Math.random() - 0.5) * 12,
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 12
  );
  const mesh = createNodeMesh(label, colorHex, position);
  const node = { id, label, color: colorHex, mesh };
  mesh.userData.nodeId = id;
  state.nodes.push(node);
  updateStats();
  return node;
}

function removeNode(node) {
  // Remove connected edges
  state.edges = state.edges.filter(e => {
    if (e.a === node || e.b === node) {
      scene.remove(e.line);
      return false;
    }
    return true;
  });
  scene.remove(node.mesh);
  state.nodes = state.nodes.filter(n => n !== node);
  if (state.selectedNode === node) deselectNode();
  updateStats();
}

function connectNodes(a, b) {
  // Avoid duplicates
  const exists = state.edges.some(e =>
    (e.a === a && e.b === b) || (e.a === b && e.b === a)
  );
  if (exists || a === b) return;
  const line = createEdgeLine(a, b);
  state.edges.push({ a, b, line });
  updateStats();
}

function selectNode(node) {
  deselectNode();
  state.selectedNode = node;
  node.mesh.material.emissiveIntensity = 1.2;
  node.mesh.userData.ring.material.opacity = 0.8;
  node.mesh.scale.setScalar(1.15);
}

function deselectNode() {
  if (state.selectedNode) {
    const n = state.selectedNode;
    n.mesh.material.emissiveIntensity = GLOW_INTENSITY;
    n.mesh.userData.ring.material.opacity = 0.4;
    n.mesh.scale.setScalar(1);
    state.selectedNode = null;
  }
  state.connectSource = null;
}

function getNodeById(id) {
  return state.nodes.find(n => n.id === id);
}

function findNodeUnderMouse(event) {
  mouse.x = (event.clientX / innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = state.nodes.map(n => n.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    return state.nodes.find(n => n.mesh === hits[0].object);
  }
  return null;
}

function getWorldPosition(event) {
  mouse.x = (event.clientX / innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);
  return target || new THREE.Vector3();
}

// ── Update edges ──
function updateEdges() {
  for (const edge of state.edges) {
    const positions = edge.line.geometry.attributes.position;
    positions.setXYZ(0, edge.a.mesh.position.x, edge.a.mesh.position.y, edge.a.mesh.position.z);
    positions.setXYZ(1, edge.b.mesh.position.x, edge.b.mesh.position.y, edge.b.mesh.position.z);
    positions.needsUpdate = true;
  }
}

// ── UI ──
function updateStats() {
  document.getElementById('stat-nodes').textContent = state.nodes.length;
  document.getElementById('stat-edges').textContent = state.edges.length;
  document.getElementById('info-panel').classList.toggle('visible', state.nodes.length > 0);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visible'), 2000);
}

// Color picker setup
const pickerEl = document.getElementById('color-picker');
let selectedColor = NODE_COLORS[0];
NODE_COLORS.forEach(c => {
  const swatch = document.createElement('div');
  swatch.className = 'color-swatch';
  swatch.style.background = c;
  if (c === selectedColor) swatch.classList.add('selected');
  swatch.onclick = () => {
    pickerEl.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    swatch.classList.add('selected');
    selectedColor = c;
  };
  pickerEl.appendChild(swatch);
});

// Node editor modal
let editingNode = null;
function openEditor(node) {
  editingNode = node || null;
  document.getElementById('editor-title').textContent = node ? 'Edit Node' : 'Add Node';
  document.getElementById('node-text').value = node ? node.label : '';
  if (node) {
    selectedColor = node.color;
    pickerEl.querySelectorAll('.color-swatch').forEach(s => {
      s.classList.toggle('selected', s.style.background === new THREE.Color(node.color).getStyle());
    });
  }
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('node-editor').classList.add('visible');
  setTimeout(() => document.getElementById('node-text').focus(), 50);
}

function closeEditor() {
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('node-editor').classList.remove('visible');
  editingNode = null;
}

document.getElementById('editor-save').onclick = () => {
  const text = document.getElementById('node-text').value.trim();
  if (!text) return;
  if (editingNode) {
    // Update existing node
    editingNode.label = text;
    editingNode.color = selectedColor;
    editingNode.mesh.material.color.set(selectedColor);
    editingNode.mesh.material.emissive.set(selectedColor);
    editingNode.mesh.userData.ring.material.color.set(selectedColor);
    // Rebuild label
    editingNode.mesh.remove(editingNode.mesh.userData.sprite);
    const newSprite = makeTextSprite(text, selectedColor);
    newSprite.position.set(0, NODE_RADIUS + 0.8, 0);
    editingNode.mesh.add(newSprite);
    editingNode.mesh.userData.sprite = newSprite;
    toast('Node updated');
  } else {
    addNode(text, selectedColor);
    toast('Node added');
  }
  closeEditor();
};
document.getElementById('editor-cancel').onclick = closeEditor;
document.getElementById('overlay').onclick = closeEditor;

// Toolbar
document.getElementById('btn-add').onclick = () => openEditor(null);
document.getElementById('btn-connect').onclick = () => {
  state.connectMode = !state.connectMode;
  document.getElementById('btn-connect').classList.toggle('active', state.connectMode);
  if (state.connectMode) toast('Click two nodes to connect them');
  else { state.connectSource = null; toast('Connect mode off'); }
};
document.getElementById('btn-delete').onclick = () => {
  if (state.selectedNode) {
    removeNode(state.selectedNode);
    toast('Node deleted');
  } else {
    toast('Select a node first');
  }
};
document.getElementById('btn-reset').onclick = () => {
  camera.position.set(0, 8, 20);
  controls.target.set(0, 0, 0);
  controls.update();
  toast('View reset');
};
document.getElementById('btn-save').onclick = saveToLocalStorage;
document.getElementById('btn-load').onclick = loadFromLocalStorage;

// ── Mouse events ──
let mouseDownPos = new THREE.Vector2();
let mouseDownTime = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouseDownPos.set(e.clientX, e.clientY);
  mouseDownTime = Date.now();

  const node = findNodeUnderMouse(e);
  if (node) {
    state.dragging = true;
    state.dragNode = node;
    controls.enabled = false;
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  // Hover effect
  const node = findNodeUnderMouse(e);
  if (state.hoveredNode && state.hoveredNode !== node && state.hoveredNode !== state.selectedNode) {
    state.hoveredNode.mesh.material.emissiveIntensity = GLOW_INTENSITY;
    state.hoveredNode.mesh.scale.setScalar(1);
  }
  if (node && node !== state.selectedNode) {
    node.mesh.material.emissiveIntensity = 0.9;
    node.mesh.scale.setScalar(1.08);
  }
  state.hoveredNode = node;
  renderer.domElement.style.cursor = node ? 'pointer' : 'default';

  // Drag
  if (state.dragging && state.dragNode) {
    const pos = getWorldPosition(e);
    if (pos) {
      state.dragNode.mesh.position.x = pos.x;
      state.dragNode.mesh.position.z = pos.z;
      updateEdges();
    }
  }
});

renderer.domElement.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;
  const dist = mouseDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));
  const elapsed = Date.now() - mouseDownTime;
  const isClick = dist < 5 && elapsed < 300;

  if (isClick) {
    const node = findNodeUnderMouse(e);
    if (state.connectMode) {
      if (node) {
        if (!state.connectSource) {
          state.connectSource = node;
          selectNode(node);
          toast('Now click the target node');
        } else {
          connectNodes(state.connectSource, node);
          deselectNode();
          state.connectSource = null;
          toast('Nodes connected');
        }
      }
    } else if (node) {
      selectNode(node);
    } else {
      deselectNode();
    }
  }

  state.dragging = false;
  state.dragNode = null;
  controls.enabled = true;
});

renderer.domElement.addEventListener('dblclick', (e) => {
  const node = findNodeUnderMouse(e);
  if (node) openEditor(node);
  else openEditor(null);
});

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (document.getElementById('node-editor').classList.contains('visible')) {
    if (e.key === 'Enter') document.getElementById('editor-save').click();
    if (e.key === 'Escape') closeEditor();
    return;
  }
  if (e.key === 'n' || e.key === 'N') openEditor(null);
  if (e.key === 'c' || e.key === 'C') document.getElementById('btn-connect').click();
  if (e.key === 'Delete' || e.key === 'Backspace') document.getElementById('btn-delete').click();
  if (e.key === 'r' || e.key === 'R') document.getElementById('btn-reset').click();
  if (e.key === 'Escape') { deselectNode(); state.connectMode = false; document.getElementById('btn-connect').classList.remove('active'); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveToLocalStorage(); }
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); loadFromLocalStorage(); }
});

// ── Save / Load ──
function saveToLocalStorage() {
  const data = {
    nodes: state.nodes.map(n => ({
      id: n.id, label: n.label, color: n.color,
      x: n.mesh.position.x, y: n.mesh.position.y, z: n.mesh.position.z,
    })),
    edges: state.edges.map(e => ({ a: e.a.id, b: e.b.id })),
    nextId: state.nextId,
  };
  localStorage.setItem('3d-mind-map', JSON.stringify(data));
  toast('Saved to browser storage');
}

function loadFromLocalStorage() {
  const raw = localStorage.getItem('3d-mind-map');
  if (!raw) { toast('No saved data found'); return; }
  const data = JSON.parse(raw);

  // Clear current
  state.nodes.forEach(n => scene.remove(n.mesh));
  state.edges.forEach(e => scene.remove(e.line));
  state.nodes = [];
  state.edges = [];
  state.selectedNode = null;
  state.nextId = data.nextId || 1;

  // Recreate nodes
  for (const nd of data.nodes) {
    const pos = new THREE.Vector3(nd.x, nd.y, nd.z);
    const mesh = createNodeMesh(nd.label, nd.color, pos);
    const node = { id: nd.id, label: nd.label, color: nd.color, mesh };
    mesh.userData.nodeId = nd.id;
    state.nodes.push(node);
  }

  // Recreate edges
  for (const ed of data.edges) {
    const a = getNodeById(ed.a);
    const b = getNodeById(ed.b);
    if (a && b) {
      const line = createEdgeLine(a, b);
      state.edges.push({ a, b, line });
    }
  }
  updateStats();
  toast('Loaded from browser storage');
}

// ── Animation ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Gentle float animation
  for (const node of state.nodes) {
    if (state.dragNode !== node) {
      node.mesh.position.y += Math.sin(t * 0.8 + node.id) * 0.0015;
    }
    node.mesh.userData.ring.rotation.z = t * 0.3 + node.id;
  }

  // Pulse edges
  for (const edge of state.edges) {
    edge.line.material.opacity = 0.4 + Math.sin(t * 2) * 0.15;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Init with sample data ──
function initSample() {
  const center = addNode('Mind Map', NODE_COLORS[0], new THREE.Vector3(0, 0, 0));
  const ideas = addNode('Ideas', NODE_COLORS[1], new THREE.Vector3(-6, 2, -3));
  const tasks = addNode('Tasks', NODE_COLORS[2], new THREE.Vector3(6, 1, -2));
  const goals = addNode('Goals', NODE_COLORS[3], new THREE.Vector3(0, -1, -7));
  const notes = addNode('Notes', NODE_COLORS[4], new THREE.Vector3(-4, 3, 5));
  const resources = addNode('Resources', NODE_COLORS[5], new THREE.Vector3(5, -2, 5));

  connectNodes(center, ideas);
  connectNodes(center, tasks);
  connectNodes(center, goals);
  connectNodes(center, notes);
  connectNodes(center, resources);
  connectNodes(ideas, notes);
  connectNodes(tasks, goals);
}

// Try loading saved data, otherwise init sample
const saved = localStorage.getItem('3d-mind-map');
if (saved) {
  loadFromLocalStorage();
} else {
  initSample();
}

animate();
</script>
